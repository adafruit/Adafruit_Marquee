; PlatformIO project for local development of the Adafruit Marquee library.
;
; Uses the pioarduino community fork of platform-espressif32
; (https://github.com/pioarduino/platform-espressif32) rather than the
; upstream platformio/platform-espressif32, which is unmaintained and does
; not ship the Arduino-ESP32 3.x core.
;
;   pio run                        # compile the example in src_dir
;   pio run -t upload -t monitor   # flash the MagTag and open the serial monitor
;
; To work on a different example, point src_dir at it.

[platformio]
src_dir = examples/marquee_simpletest
default_envs = magtag

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_type = debug

; src/ is compiled straight into the example rather than being listed as a lib_deps entry.
build_src_filter = +<*> +<../../src/>
build_flags =
	-Wall
	-I$PROJECT_DIR/src
	; Bring-up tracing. The ESP32-S2 cannot deliver a panic backtrace over USB
	; (no USB-Serial-JTAG peripheral; IDF console is UART0 and the panic handler
	; runs with interrupts off), so step markers are the substitute. Remove both
	; once the bring-up crash is resolved.
	-DMQTT_BRINGUP_TRACE

lib_deps =
	; Framework libraries, named explicitly. Nothing under src_dir includes
	; WiFi.h directly, so the library dependency finder does not reach them on
	; its own - and with Adafruit IO Arduino gone, nothing else declares them.
	; WiFiClientSecure.h lives in NetworkClientSecure on Arduino-ESP32 3.x.
	WiFi
	NetworkClientSecure
	adafruit/Adafruit EPD
	adafruit/Adafruit SPIFlash
	adafruit/Adafruit TinyUSB Library
	bblanchon/ArduinoJson
	adafruit/Adafruit ImageReader Library@^2.12.0
	densaugeo/base64@^1.4.0
    robtillaart/CRC@^1.0.4
	; Local fork: heap-allocates the packet buffer, sizes each subscription's
	; payload buffer independently and lets the client's buffer size be passed
	; at construction, so the bitmap feed can carry a ~21KB payload without
	; every subscription paying for it and without a -DMAXBUFFERSIZE.
	; Replace with a pinned git URL before CI.
	symlink://../Adafruit_MQTT_Library

; These come from the MQTT library's own `depends=` line, not from anything this
; project uses. (WiFiManager was pulled in by Adafruit IO Arduino, now dropped.)
lib_ignore =
	WiFiNINA
	WiFiNINA_-_Adafruit_Fork
	WiFi101

lib_compat_mode = strict

[env:magtag]
board = adafruit_magtag29_esp32s2
board_build.filesystem = littlefs
