; PlatformIO project for local development of the Adafruit Marquee library.
;
; Uses the pioarduino community fork of platform-espressif32
; (https://github.com/pioarduino/platform-espressif32) rather than the
; upstream platformio/platform-espressif32, which is unmaintained and does
; not ship the Arduino-ESP32 3.x core.
;
;   pio run                        # compile the example in src_dir
;   pio run -t upload -t monitor   # flash the MagTag and open the serial monitor
;
; To work on a different example, point src_dir at it.

[platformio]
src_dir = examples/marquee_simpletest
default_envs = magtag

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; This repo's src/ is compiled straight into the example rather than being
; listed as a lib_deps entry: pointing lib_deps back at the project (via
; symlink://.) makes PlatformIO's dependency finder stop resolving nested
; dependencies, so Adafruit_GFX.h never reaches Adafruit EPD's compile.
; build_src_filter paths are relative to src_dir above.
build_src_filter = +<*> +<../../src/>
build_flags =
	-Wall
	-I$PROJECT_DIR/src

; Mirrors the depends= line in library.properties; transitive deps
; (Adafruit BusIO, Adafruit GFX, Adafruit MQTT, ArduinoHttpClient,
; SdFat - Adafruit Fork, ...) are resolved automatically.
lib_deps =
	adafruit/Adafruit EPD
	adafruit/Adafruit IO Arduino
	adafruit/Adafruit SPIFlash
	adafruit/Adafruit TinyUSB Library
	bblanchon/ArduinoJson
	densaugeo/base64@^1.4.0

[env:magtag]
board = adafruit_magtag29_esp32s2
board_build.filesystem = littlefs
