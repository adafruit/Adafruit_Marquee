; PlatformIO project for local development of the Adafruit Marquee library.
;
; Uses the pioarduino community fork of platform-espressif32
; (https://github.com/pioarduino/platform-espressif32) rather than the
; upstream platformio/platform-espressif32, which is unmaintained and does
; not ship the Arduino-ESP32 3.x core.
;
;   pio run                        # compile the example in src_dir
;   pio run -t upload -t monitor   # flash the MagTag and open the serial monitor
;
; To work on a different example, point src_dir at it.

[platformio]
src_dir = examples/marquee_simpletest
default_envs = magtag

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_type = debug

; src/ is compiled straight into the example rather than being listed as a lib_deps entry.
build_src_filter = +<*> +<../../src/>
build_flags =
	-Wall
	-I$PROJECT_DIR/src

lib_deps =
	WiFi
	NetworkClientSecure
	;adafruit/Adafruit EPD
	adafruit/Adafruit SPIFlash
	adafruit/Adafruit TinyUSB Library
	bblanchon/ArduinoJson
	adafruit/Adafruit ImageReader Library
	densaugeo/base64
    robtillaart/CRC
	; Local fork
	symlink://../Adafruit_MQTT_Library
    symlink://../Adafruit_EPD

lib_ignore =
	WiFiNINA
	WiFiNINA_-_Adafruit_Fork
	WiFi101

lib_compat_mode = strict

[env:magtag]
board = adafruit_magtag29_esp32s2
board_build.filesystem = littlefs

[env:adafruit_feather_esp32s3]
board = adafruit_feather_esp32s3
board_build.filesystem = littlefs

[env:x4pro]
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.partitions = tinyuf2-xteink4-pro-uc8279.csv
build_flags =
  ; An env-level build_flags replaces the [env] value instead of appending, so
  ; pull the shared flags (-Wall, -I src) back in explicitly.
  ${env.build_flags}
  ; --- USB: TinyUSB owns the OTG peripheral -------------------------------
  ; MODE=0 selects USB-OTG (TinyUSB) over the hardware USB-Serial/JTAG. Required
  ; by Adafruit_TinyUSB_Arduino on the S3; Serial then routes to TinyUSB CDC.
  ; The two *_ON_BOOT=0 flags stop the core claiming the MSC/DFU interfaces that
  ; Adafruit_USBD_MSC needs.
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_USB_DFU_ON_BOOT=0
  -DUSB_MANUFACTURER=\"Marquee\"
  -DUSB_PRODUCT=\"Marquee_X4_Pro\"
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  ; --- Board select --------------------------------------------------------
  ; This env uses the stock esp32-s3-devkitc1-n16r8 board, so the core only
  ; defines ARDUINO_ESP32S3_DEV, which every generic S3 devkit shares. This
  ; flag is what marqueeBoardPowerUp() gates on.
  -DMARQUEE_BOARD_XTEINK_X4_PRO
  -std=gnu++2a
build_unflags =
  -std=gnu++11